name: Update contribution snake

on:
  schedule:
    # 10:23 Asia/Shanghai; scheduled runs may be delayed by GitHub.
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'

concurrency:
  group: contribution-snake
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate snake from real contributions
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ github.token }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#d9a941&color_dots=#e8eddc,#b9cf98,#8cb56e,#59864c,#315c3d
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ebc65c&color_dots=#1d2a23,#345b3b,#56814a,#8ebd69,#badb8c

      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          jekyll: false
          commit_message: 'Update contribution snake [skip ci]'
        env:
          GITHUB_TOKEN: ${{ github.token }}
